name: Build and release ModuFind
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compilers=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","${env:ProgramFiles}\Inno Setup 6\ISCC.exe","${env:ProgramFiles}\Inno Setup 7\ISCC.exe")
          if(-not ($compilers | Where-Object {Test-Path -LiteralPath $_})){
            choco install innosetup --version=6.7.3 --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed.'}
          }
      - name: Build and test
        shell: pwsh
        run: |
          [xml]$props=Get-Content Directory.Build.props
          $version=[string]$props.Project.PropertyGroup.Version
          if('${{ github.ref_type }}' -eq 'tag'){
            $tag='${{ github.ref_name }}'
            if($tag -cne "v$version"){throw "Tag $tag does not match source version $version"}
          }
          ./build-release.ps1 -Version $version
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModuFind-windows-x64
          path: artifacts/release/*
      - name: Publish stable release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='${{ github.ref_name }}'
          gh release view $tag --json id 2>$null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag artifacts/release/* --clobber
          } else {
            gh release create $tag artifacts/release/* --title "모두찾아줘 $tag" --generate-notes --verify-tag
          }
          if($LASTEXITCODE -ne 0){throw 'GitHub Release publication failed.'}
